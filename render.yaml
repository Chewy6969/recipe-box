services:
  - type: web
    name: recipe-box-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: recipe-box-db
          property: connectionString

databases:
  - name: recipe-box-db
    plan: free
